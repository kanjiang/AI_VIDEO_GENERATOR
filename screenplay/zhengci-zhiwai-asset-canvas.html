<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>《证词之外》Asset Canvas</title>
    <style>
        :root {
            --bg: #111111;
            --panel: #171717;
            --card-bg: #1a1a1a;
            --card-border: #2a2a2a;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --badge-char: #818cf8;
            --badge-loc: #f472b6;
            --badge-prop: #fb923c;
            --status-generated: #4ade80;
            --status-missing: #4b5563;
            --status-flagged: #f59e0b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #1c1c1c 0%, #111111 48%, #0b0b0b 100%);
            color: var(--text-primary);
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            padding: 28px;
        }

        .wrap {
            max-width: 1500px;
            margin: 0 auto;
        }

        .header {
            border: 1px solid #232323;
            background: rgba(23, 23, 23, 0.92);
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 6px;
            font-size: 28px;
        }

        .meta {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.6;
        }

        .note {
            margin-top: 12px;
            padding: 10px 12px;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            background: #151515;
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.6;
        }

        .progress-panel {
            margin-top: 16px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 8px;
        }

        .progress-track {
            width: 100%;
            height: 10px;
            border-radius: 999px;
            background: #222222;
            border: 1px solid #2f2f2f;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #34d399 0%, #4ade80 100%);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tabs,
        .legend {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tab,
        .legend-pill {
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid #333333;
            background: transparent;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .tab {
            cursor: pointer;
        }

        .tab.active {
            background: #f4f4f5;
            color: #111111;
            border-color: #f4f4f5;
            font-weight: 600;
        }

        .section {
            margin-bottom: 28px;
        }

        .section h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--text-muted);
            margin: 0 0 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
        }

        .card.generated {
            border-color: rgba(74, 222, 128, 0.65);
        }

        .card.flagged {
            border-color: rgba(245, 158, 11, 0.65);
        }

        .thumb {
            position: relative;
            background: #202020;
            border-bottom: 1px solid #262626;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .thumb.character {
            aspect-ratio: 3 / 4;
        }

        .thumb.location {
            aspect-ratio: 16 / 9;
        }

        .thumb.prop {
            aspect-ratio: 1 / 1;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .placeholder {
            color: #4b5563;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            font-size: 11px;
            text-align: center;
            line-height: 1.7;
            padding: 0 12px;
        }

        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 9px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.72);
            font-size: 11px;
            color: #ffffff;
        }

        .card-body {
            padding: 14px;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 8px;
        }

        .priority {
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 11px;
            border: 1px solid #333333;
            color: var(--text-secondary);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 11px;
            color: #ffffff;
        }

        .badge.character {
            background: var(--badge-char);
        }

        .badge.location {
            background: var(--badge-loc);
        }

        .badge.prop {
            background: var(--badge-prop);
        }

        .card h3 {
            margin: 0 0 4px;
            font-size: 18px;
            line-height: 1.35;
        }

        .card .en {
            color: var(--text-secondary);
            font-size: 12px;
            margin-bottom: 8px;
        }

        .filename {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
            word-break: break-all;
        }

        details {
            border: 1px solid #2b2b2b;
            border-radius: 12px;
            background: #151515;
            padding: 10px 12px;
            margin-top: 10px;
        }

        summary {
            cursor: pointer;
            color: #dbe3ef;
            font-size: 13px;
        }

        .prompt {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.6;
            margin-top: 10px;
            white-space: pre-wrap;
        }

        .spatial-note {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px dashed #3b3b3b;
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 1.6;
            background: #141414;
        }

        @media (max-width: 980px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 16px;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header class="header">
            <h1>《证词之外》Asset Canvas</h1>
            <div class="meta">生成日期：2026-06-01 · 当前版本：新版 72 镜重拆 · 主资产 20 张 + 二层补充 10 张</div>
            <div class="note">当前画布已切到最新剧本口径。旧版“消防楼梯”“陈伯具象身份”“林晚监控终幕”节点已移除。场地空间标注目前仍待补充，后续如需进入 blocking
                阶段，请在生成好场地图后补录镜头朝向、角色站位与主要光源。</div>
            <div class="progress-panel">
                <div class="progress-label">
                    <span id="progressText">0 / 0 已生成</span>
                    <span id="missingText">仍缺 0 张</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </header>

        <div class="toolbar">
            <div class="tabs">
                <button class="tab active" data-filter="all">全部</button>
                <button class="tab" data-filter="character">Characters</button>
                <button class="tab" data-filter="location">Locations</button>
                <button class="tab" data-filter="prop">Props</button>
            </div>
            <div class="legend">
                <span class="legend-pill">✅ 已生成</span>
                <span class="legend-pill">⬜ 待生成</span>
                <span class="legend-pill">⚠️ 待复核</span>
            </div>
        </div>

        <section class="section" data-section="main">
            <h2>Main Assets</h2>
            <div class="grid" id="mainGrid"></div>
        </section>

        <section class="section" data-section="secondary">
            <h2>Secondary Assets</h2>
            <div class="grid" id="secondaryGrid"></div>
        </section>
    </div>

    <script>
        const assets = [
            { priority: 'main', category: 'character', zh: '林深', en: 'Lin Shen', filename: 'lin_shen.png', status: 'generated', prompt: '30岁左右中国男性，体面管理层外壳下压着极深控制欲；深炭灰夹克、深色内搭、深色长裤、低调皮鞋；角色设定板，纯白背景，超写实。' },
            { priority: 'main', category: 'character', zh: '周妍', en: 'Zhou Yan', filename: 'zhou_yan.png', status: 'generated', prompt: '二十多岁中国女性，短发或及肩直发，眼神锐利，状态是被逼成长的执行者；深色旧夹克、浅灰内搭、深色长裤；角色设定板，纯白背景，超写实。' },
            { priority: 'main', category: 'character', zh: '林晚', en: 'Lin Wan Confined', filename: 'lin_wan_bound.png', status: 'generated', prompt: '二十多岁中国女性，疲惫但清醒，被隔绝和受控，不拍血腥；浅色旧上衣与深色长裤；角色设定板，纯白背景，超写实。' },
            { priority: 'main', category: 'character', zh: '心腹保安轮廓', en: 'Security Guard Shadow', filename: 'security_guard_shadow.png', status: 'missing', prompt: '匿名物业安保执行者，制服规整，轮廓化、逆光化，禁止清楚露脸；角色设定板，纯白背景，超写实。' },

            { priority: 'main', category: 'location', zh: '林深书房', en: 'Study Room Wide', filename: 'study_room_wide.png', status: 'generated', prompt: '夜晚私人书房广角全景，深色木桌、台灯、电脑、耳机、文件纸整齐摆放；暖白台灯加极弱冷蓝窗光；克制、理性、压抑。', spatial: '空间标注待补：建议补录书桌朝向、门口机位、台灯主光方向。' },
            { priority: 'main', category: 'location', zh: '307入口视角', en: 'Room 307 Entry', filename: 'room_307_entry.png', status: 'generated', prompt: '老旧但住过人的员工公寓客厅广角，从玄关看向客厅；半搬空、木地板旧、角落有老旧智能音箱，冷灰夜光渗入。', spatial: '空间标注待补：建议补录门口到音箱的轴线、周妍初始站位。' },
            { priority: 'main', category: 'location', zh: '307反角视角', en: 'Room 307 Reverse', filename: 'room_307_reverse.png', status: 'generated', prompt: '从307客厅靠窗一侧回看玄关和大门，门外冷白光切入室内，空间关系清楚、已装修、有生活痕迹。', spatial: '空间标注待补：建议补录门缝光斑方向与音箱前景位置。' },
            { priority: 'main', category: 'location', zh: '电梯轿厢', en: 'Elevator Cabin', filename: 'elevator_cabin.png', status: 'missing', prompt: '老式高层住宅电梯轿厢内部广角，金属门、旧楼层面板、冷白顶灯，狭窄压迫。', spatial: '空间标注待补：建议补录人物前后站位与15层停顿时门缝方向。' },
            { priority: 'main', category: 'location', zh: '29楼走廊', en: 'Floor 29 Wide', filename: 'floor29_wide.png', status: 'missing', prompt: '冷白平光的29楼走廊广角，设备间门与露台铁门都能辨认，像被切出来的权限禁区。', spatial: '空间标注待补：建议补录设备间门、露台门和人物前进轴线。' },
            { priority: 'main', category: 'location', zh: '设备间全景', en: 'Device Room Wide', filename: 'device_room_wide.png', status: 'missing', prompt: '成排机柜、工作台、屏幕和广播音箱组成的声音工厂，不是科幻实验室，冷屏与指示灯照明。', spatial: '空间标注待补：建议补录机柜排布、工作台位置和露台门方向。' },
            { priority: 'main', category: 'location', zh: '露台全景', en: 'Terrace Wide', filename: 'terrace_wide.png', status: 'generated', prompt: '高层露台广角，护栏、维修箱、白色手机和露台门同框，城市夜景冰冷虚焦。', spatial: '空间标注待补：建议补录维修箱与护栏相对位置、门体方向。' },
            { priority: 'main', category: 'location', zh: '林晚软禁房间', en: 'Locked Room Wide', filename: 'locked_room_wide.png', status: 'missing', prompt: '昏暗密闭房间广角，窗帘紧闭、门锁厚重、环境简陋但非血腥，重点是隔绝与受控。', spatial: '空间标注待补：建议补录门、窗、床位或椅位的相对关系。' },

            { priority: 'main', category: 'prop', zh: '书房桌面组合', en: 'Study Desk Wide', filename: 'study_desk_wide.png', status: 'generated', prompt: '深色木桌、笔记本、台灯、耳机和工作纸的组合构图，暖白台灯照亮桌面，周围压暗。' },
            { priority: 'main', category: 'prop', zh: '隐藏声纹界面', en: 'Study Screen Waveform', filename: 'study_screen_waveform.png', status: 'generated', prompt: '专业音频编辑界面特写，多条女性语音波形、剪切片段与中文工程标记，工业化真实风格。' },
            { priority: 'main', category: 'prop', zh: '音箱待机蓝灯', en: 'Smart Speaker Idle', filename: 'smart_speaker_idle.png', status: 'generated', prompt: '老旧家用智能音箱，熄屏待机，顶部蓝灯极弱，纯白背景，产品摄影。' },
            { priority: 'main', category: 'prop', zh: '音箱口令校验中', en: 'Smart Speaker Red Green', filename: 'smart_speaker_red_green.png', status: 'generated', prompt: '同一台旧款音箱，红绿交替闪烁转绿，触摸屏显示简洁校验界面。' },
            { priority: 'main', category: 'prop', zh: '音箱解锁成功', en: 'Smart Speaker Unlocked', filename: 'smart_speaker_unlocked.png', status: 'generated', prompt: '同一台旧款音箱，绿色稳定灯，触摸屏显示解锁成功或待播放状态。' },
            { priority: 'main', category: 'prop', zh: '采样文件列表', en: 'Device Screen Files', filename: 'device_screen_files.png', status: 'generated', prompt: '工业软件窗口内滚动显示喘息、争吵、哭泣等中文文件名，冷白真实可读。' },
            { priority: 'main', category: 'prop', zh: '露台白色手机', en: 'White Phone Call', filename: 'white_phone_call.png', status: 'generated', prompt: '白色旧款手机放在露台维修箱上，通话界面亮起，处于外放状态，周围带夜风冷光。' },
            { priority: 'main', category: 'prop', zh: '微型录音笔', en: 'Recorder Pen Close', filename: 'recorder_pen_close.png', status: 'missing', prompt: '小型金属录音笔近景，低调、真实、略有磨损，像常年放在外套口袋里。' },

            { priority: 'secondary', category: 'prop', zh: '未知来电手机界面', en: 'Unknown Caller Phone', filename: 'unknown_caller_phone.png', status: 'missing', prompt: '真实手机UI，展示未知来电或语音回放页面，不出现品牌logo。' },
            { priority: 'secondary', category: 'prop', zh: '生活照与耳机', en: 'Study Photo Set', filename: 'study_photo_set.png', status: 'missing', prompt: '书桌局部特写，生活照与耳机并置，暗示兄妹关系但不煽情。' },
            { priority: 'secondary', category: 'prop', zh: '周妍手机壳导线', en: 'Zhou Yan Phone Case Cue', filename: 'zhou_yan_phone_case_cue.png', status: 'missing', prompt: '手机壳边角裂纹与花纹局部特写，用于与露台白色手机形成回扣。' },
            { priority: 'secondary', category: 'prop', zh: '门缝手电压迫', en: 'Security Flashlight Gap', filename: 'security_flashlight_gap.png', status: 'missing', prompt: '从室内看房门门缝，两束手电光交错扫过，压迫感强，不见清晰人脸。' },
            { priority: 'secondary', category: 'prop', zh: '电梯楼层面板', en: 'Elevator Panel 29', filename: 'elevator_panel_29.png', status: 'missing', prompt: '老式电梯楼层面板特写，可显示15层卡停和29层抵达状态。' },
            { priority: 'secondary', category: 'location', zh: '设备间门缝冷光', en: 'Device Room Door Crack', filename: 'device_room_door_crack.png', status: 'missing', prompt: '29楼设备间虚掩门缝近景，门缝里漏出冷光和一点设备轮廓。', spatial: '空间标注待补：建议补录门缝朝向和门外人物站位。' },
            { priority: 'secondary', category: 'prop', zh: '墙面广播音箱红灯', en: 'Wall Speaker Red', filename: 'wall_speaker_red.png', status: 'generated', prompt: '老式墙面广播音箱特写，边缘略旧，红色指示灯亮起。' },
            { priority: 'secondary', category: 'prop', zh: '护栏连接处', en: 'Railing Joint Close', filename: 'railing_joint_close.png', status: 'generated', prompt: '高层露台护栏连接件近景，金属老化与焊点真实可见，但不明显暴露人为破坏。' },
            { priority: 'secondary', category: 'prop', zh: '收益后台', en: 'Audio Profit Dashboard', filename: 'audio_profit_dashboard.png', status: 'missing', prompt: '后台数据面板展示收音样本、声纹售卖和收益数字，像工业管理后台。' },
            { priority: 'secondary', category: 'prop', zh: '黑色制式皮鞋', en: 'Ground Shoes Close', filename: 'ground_shoes_close.png', status: 'missing', prompt: '地面低角度特写，黑色制式皮鞋走入昏暗地面，只服务匿名收尾。' }
        ];

        const root = '../assets/zhengci-zhiwai/';
        const mainGrid = document.getElementById('mainGrid');
        const secondaryGrid = document.getElementById('secondaryGrid');
        const tabs = [...document.querySelectorAll('.tab')];

        function badgeClass(category) {
            return category === 'character' ? 'character' : category === 'location' ? 'location' : 'prop';
        }

        function categoryLabel(category) {
            return category === 'character' ? 'Character' : category === 'location' ? 'Location' : 'Prop';
        }

        function statusLabel(status) {
            if (status === 'generated') return '✅ 已生成';
            if (status === 'flagged') return '⚠️ 待复核';
            return '⬜ 待生成';
        }

        function renderCard(asset) {
            const card = document.createElement('article');
            card.className = `card ${asset.status}`;
            card.dataset.category = asset.category;

            const thumb = document.createElement('div');
            thumb.className = `thumb ${asset.category}`;

            if (asset.status === 'generated' || asset.status === 'flagged') {
                const img = document.createElement('img');
                img.src = root + asset.filename;
                img.alt = asset.en;
                thumb.appendChild(img);
            } else {
                const placeholder = document.createElement('div');
                placeholder.className = 'placeholder';
                placeholder.innerHTML = '待生成<br />' + asset.en.toUpperCase();
                thumb.appendChild(placeholder);
            }

            const badge = document.createElement('span');
            badge.className = 'status-badge';
            badge.textContent = statusLabel(asset.status);
            thumb.appendChild(badge);

            const body = document.createElement('div');
            body.className = 'card-body';
            body.innerHTML = `
        <div class="row">
          <span class="priority">${asset.priority === 'main' ? 'Main' : 'Secondary'}</span>
          <span class="badge ${badgeClass(asset.category)}">${categoryLabel(asset.category)}</span>
        </div>
        <h3>${asset.zh}</h3>
        <div class="en">${asset.en}</div>
        <div class="filename">${asset.filename}</div>
      `;

            const details = document.createElement('details');
            const summary = document.createElement('summary');
            summary.textContent = '展开提示词';
            const prompt = document.createElement('div');
            prompt.className = 'prompt';
            prompt.textContent = asset.prompt;
            details.appendChild(summary);
            details.appendChild(prompt);
            body.appendChild(details);

            if (asset.category === 'location') {
                const note = document.createElement('div');
                note.className = 'spatial-note';
                note.textContent = asset.spatial || '空间标注待补：请在该场地图生成后补录镜头朝向、角色站位、道具摆放与光源方向。';
                body.appendChild(note);
            }

            card.appendChild(thumb);
            card.appendChild(body);
            return card;
        }

        function mountAssets(filter = 'all') {
            mainGrid.innerHTML = '';
            secondaryGrid.innerHTML = '';

            assets.forEach((asset) => {
                if (filter !== 'all' && asset.category !== filter) {
                    return;
                }

                const card = renderCard(asset);
                if (asset.priority === 'main') {
                    mainGrid.appendChild(card);
                } else {
                    secondaryGrid.appendChild(card);
                }
            });
        }

        function updateProgress() {
            const total = assets.length;
            const generated = assets.filter((asset) => asset.status === 'generated').length;
            const missing = assets.filter((asset) => asset.status !== 'generated').length;
            document.getElementById('progressText').textContent = `${generated} / ${total} 已生成`;
            document.getElementById('missingText').textContent = `仍缺 ${missing} 张`;
            document.getElementById('progressFill').style.width = `${(generated / total) * 100}%`;
        }

        tabs.forEach((tab) => {
            tab.addEventListener('click', () => {
                tabs.forEach((item) => item.classList.remove('active'));
                tab.classList.add('active');
                mountAssets(tab.dataset.filter);
            });
        });

        updateProgress();
        mountAssets('all');
    </script>
</body>

</html>
